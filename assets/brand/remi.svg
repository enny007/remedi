<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="40" y1="30" x2="200" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="70" y1="80" x2="170" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CCFBF1"/>
      <stop offset="100%" stop-color="#99F6E4"/>
    </linearGradient>
    <linearGradient id="cheekGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F766E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient pulse halo ring -->
  <circle cx="120" cy="120" r="95" stroke="#14B8A6" stroke-width="2.5" stroke-dasharray="6 8" stroke-opacity="0.3"/>
  
  <!-- Shadow under mascot -->
  <ellipse cx="120" cy="208" rx="55" ry="12" fill="#042F2E" fill-opacity="0.12"/>

  <!-- Mascot Main Body: Friendly rounded capsule creature with little antenna/spark -->
  <g filter="url(#softGlow)">
    <!-- Main Capsule Body -->
    <rect x="65" y="45" width="110" height="145" rx="55" fill="url(#bodyGrad)"/>
    
    <!-- Top Cap Highlight -->
    <path d="M72 80 C80 55, 160 55, 168 80" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4"/>

    <!-- Light Warm Belly Patch -->
    <rect x="76" y="98" width="88" height="84" rx="42" fill="url(#bellyGrad)"/>
    
    <!-- Care Cross Emblem on chest -->
    <rect x="114" y="132" width="12" height="30" rx="6" fill="#0F766E"/>
    <rect x="105" y="141" width="30" height="12" rx="6" fill="#0F766E"/>
    
    <!-- Friendly Big Eyes with sparkling highlights -->
    <!-- Left Eye -->
    <ellipse cx="98" cy="92" rx="9" ry="11" fill="#042F2E"/>
    <circle cx="101" cy="88" r="4" fill="#FFFFFF"/>
    <circle cx="95" cy="96" r="1.5" fill="#FFFFFF"/>
    
    <!-- Right Eye (Playful Wink or Bright Gaze) -->
    <ellipse cx="142" cy="92" rx="9" ry="11" fill="#042F2E"/>
    <circle cx="145" cy="88" r="4" fill="#FFFFFF"/>
    <circle cx="139" cy="96" r="1.5" fill="#FFFFFF"/>

    <!-- Sweet Smiling Mouth -->
    <path d="M112 108 Q120 116 128 108" stroke="#042F2E" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Rosy Cheeks -->
    <circle cx="86" cy="102" r="7" fill="url(#cheekGlow)"/>
    <circle cx="154" cy="102" r="7" fill="url(#cheekGlow)"/>

    <!-- Little Left Arm (Waving) -->
    <path d="M66 120 C50 110, 42 95, 48 85 C54 77, 65 92, 68 108" fill="#14B8A6" stroke="#0F766E" stroke-width="2"/>

    <!-- Little Right Arm (Resting on hip) -->
    <path d="M174 122 C186 126, 192 138, 185 146 C178 152, 172 138, 172 128" fill="#14B8A6" stroke="#0F766E" stroke-width="2"/>

    <!-- Antenna Heart / Vital Spark -->
    <path d="M120 45 L120 30" stroke="#0D9488" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="120" cy="24" r="8" fill="#F43F5E"/>
    <circle cx="120" cy="24" r="13" stroke="#F43F5E" stroke-width="2" stroke-opacity="0.35"/>
  </g>
</svg>