<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="remedi-bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="pill-glow" x1="48" y1="48" x2="208" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="soft-shadow" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042F2E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="256" height="256" rx="60" fill="url(#remedi-bg)"/>
  
  <!-- Subtle inner ambient halo ring (representing continuity & routine adherence) -->
  <circle cx="128" cy="128" r="88" stroke="#5EEAD4" stroke-width="3" stroke-opacity="0.2" stroke-dasharray="8 6"/>
  <circle cx="128" cy="128" r="76" stroke="#99F6E4" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Iconic Centerpiece: Intersecting Care Capsule & Clinical Cross Emblem with Soft Drop Shadow -->
  <g filter="url(#soft-shadow)">
    <!-- Smooth Pill / Capsule Base angled at 45 degrees -->
    <rect x="80" y="56" width="96" height="144" rx="48" transform="rotate(-45 128 128)" fill="url(#pill-glow)"/>
    
    <!-- Capsule dividing waistline -->
    <line x1="85" y1="85" x2="171" y2="171" stroke="#134E4A" stroke-width="4" stroke-opacity="0.25" stroke-linecap="round"/>

    <!-- Harmonious Medical Plus / Health Spark in bright crisp contrast -->
    <!-- Vertical bar -->
    <rect x="117" y="94" width="22" height="68" rx="11" fill="#FFFFFF"/>
    <!-- Horizontal bar -->
    <rect x="94" y="117" width="68" height="22" rx="11" fill="#FFFFFF"/>
  </g>

  <!-- Active Offline Heartbeat / Signal Dot (Sync & Life indicator) -->
  <circle cx="188" cy="68" r="14" fill="#34D399"/>
  <circle cx="188" cy="68" r="22" stroke="#34D399" stroke-width="2" stroke-opacity="0.4"/>
</svg>