name: remedi
description: "Remedi — offline-first multilingual medication reminder."


version: 1.0.0+1

environment:
  sdk: ^3.10.7


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  drift: ">=2.26.0 <2.32.0"
  drift_flutter: ^0.2.7
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_svg: ^2.3.0
  material_symbols_icons: ^4.2960.0
  qr_flutter: ^4.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  speech_to_text: ^7.4.0
  health: ^13.3.2
  collection: ^1.19.1
  flutter_localizations:
    sdk: flutter
  sqlite3_flutter_libs: ^0.5.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ">=2.26.0 <2.32.0"
  build_runner: ^2.15.1


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: NotoSansExt
      fonts:
        - asset: assets/fonts/NotoSansExt-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansExt-Bold.ttf
          weight: 700
